{% extends 'base.html' %}

{% block content %}
<section class="post-detail">
	<h2>{{ post.title }}</h2>

	<h3>Muallif: {{ post.author }}</h3>

	<p>{{ post.body }}</p>

	<a href="{% url 'post-edit' post.pk %}" class="edit-btn">O'zgartirish</a>
	<a href="{% url 'post-delete' post.pk %}" class="edit-btn">O'chirish</a>
</section>

<style>
	.post-detail {
		background: #fff;
		padding: 35px 40px;

		border: 1px solid #e5e7eb;
		border-radius: 12px;
	}

	/* Sarlavha */
	.post-detail h2 {
		margin: 0 0 12px;

		color: #1f2937;
		font-size: 32px;
		font-weight: 700;
	}

	/* Muallif */
	.post-detail h3 {
		margin: 0 0 25px;

		color: #6b7280;
		font-size: 15px;
		font-weight: 500;
	}

	/* Post matni */
	.post-detail p {
		margin: 0;

		color: #374151;
		font-size: 17px;
		line-height: 1.8;
	}

	.post-detail .edit-btn {
		display: inline-block;
		margin-top: 25px;
		padding: 10px 18px;
		background: #4f46e5;
		color: white;
		text-decoration: none;
		border-radius: 8px;
		font-size: 15px;
		font-weight: 600;
		transition: 0.2s;
	}

	.post-detail .edit-btn:hover {
		background: #3730a3;
		transform: translateY(-2px);
	}
</style>
{% endblock content %}
